version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: dankoo-postgres
    environment:
      POSTGRES_DB: ${DATABASE_NAME:-dankoo_electronics}
      POSTGRES_USER: ${DATABASE_USER:-dankoo_user}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:-secure_password_change_in_production}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-dankoo_user}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dankoo-network

  redis:
    image: redis:7-alpine
    container_name: dankoo-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - dankoo-network

  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    container_name: dankoo-backend
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_HOST: postgres
      DATABASE_PORT: 5432
      DATABASE_NAME: ${DATABASE_NAME:-dankoo_electronics}
      DATABASE_USER: ${DATABASE_USER:-dankoo_user}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:-secure_password_change_in_production}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      BACKEND_PORT: 3001
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - /app/node_modules
      - ./uploads:/app/uploads
    networks:
      - dankoo-network
    command: npm run start:dev

  frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    container_name: dankoo-frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:3001/api
      NEXT_PUBLIC_APP_NAME: DANKOO ELECTRONICS
    ports:
      - "3000:3000"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - dankoo-network
    command: npm run dev

volumes:
  postgres_data:
  redis_data:

networks:
  dankoo-network:
    driver: bridge
